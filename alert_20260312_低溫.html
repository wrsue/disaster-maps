<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>低溫特報 | 災害警戒地圖</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans TC',sans-serif;background:#1a1a2e;color:#eaeaea}
#header{background:linear-gradient(135deg,#16213e 0%,#0f3460 100%);padding:18px 24px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.h-icon{font-size:2.2rem;margin-bottom:6px}
h1{font-size:1.5rem;font-weight:700;letter-spacing:1px}
.sub{font-size:.82rem;color:#a8dadc;margin-top:8px;line-height:1.5}
#map{height:calc(100vh - 160px);width:100%}
#legend{position:absolute;bottom:60px;left:12px;background:rgba(22,33,62,.92);padding:12px 16px;border-radius:10px;z-index:1000;font-size:.78rem;box-shadow:0 4px 12px rgba(0,0,0,.4)}
#legend h4{margin-bottom:8px;font-size:.88rem}
.li{display:flex;align-items:center;margin:5px 0}
.lc{width:18px;height:18px;border-radius:4px;margin-right:10px;border:1px solid #555}
#footer{background:#16213e;padding:10px 20px;text-align:center;font-size:.72rem;color:#6c757d}
.back-link{color:#4dabf7;text-decoration:none;margin-right:15px}
.back-link:hover{text-decoration:underline}
.pt{font-weight:700;font-size:1rem;margin-bottom:6px;color:#ff6b6b}
.pi{font-size:.82rem;margin:3px 0;color:#ccc}
.leaflet-control-layers{background:rgba(255,255,255,.95)!important;color:#333;border:1px solid #ccc!important;border-radius:8px!important;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.leaflet-control-layers-expanded{padding:8px 12px!important}
.leaflet-control-layers label{color:#333}
</style>
</head>
<body>
<div id="header">
  <div class="h-icon">🥶</div>
  <h1>低溫特報</h1>
  <div class="sub">
    生效：2026-03-12 10:46 ～ 2026-03-13 10:00（TPE）｜影響：13 縣市 （精確鄉鎮：102 個）｜🔴 發布中<br/>
    資料來源：<a href="https://alerts.ncdr.nat.gov.tw" target="_blank" style="color:#4dabf7">NCDR</a> | 更新：2026-03-12 10:49
  </div>
</div>
<div id="map"></div>
<div id="legend">
  <h4>📊 圖例</h4>
  <div class="li"><div class="lc" style="background:#00CED1;opacity:.8"></div>低溫特報</div>
  <hr style="border-color:#333;margin:7px 0"/>
  <div style="font-size:.72rem;color:#889">點擊區域查看詳情</div>
</div>
<div id="footer">
  <a href="index.html" class="back-link">← 返回警報列表</a>
  <span>📅 2026-03-12 10:49 TPE | NCDR</span>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const WARNING_AREAS = new Set(["新北市烏來區", "新北市坪林區", "新北市三峽區", "新北市石碇區", "新北市新店區", "新北市中和區", "新北市深坑區", "桃園市中壢區", "桃園市楊梅區", "桃園市平鎮區", "桃園市龍潭區", "桃園市大溪區", "桃園市復興區", "新竹縣新埔鎮", "新竹縣關西鎮", "新竹縣芎林鄉", "新竹縣寶山鄉", "新竹縣竹東鎮", "新竹縣峨眉鄉", "新竹縣尖石鄉", "新竹縣橫山鄉", "新竹縣五峰鄉", "新竹縣北埔鄉", "苗栗縣通霄鎮", "苗栗縣頭份市", "苗栗縣三灣鄉", "苗栗縣銅鑼鄉", "苗栗縣三義鄉", "苗栗縣頭屋鄉", "苗栗縣公館鄉", "苗栗縣獅潭鄉", "苗栗縣南庄鄉", "苗栗縣大湖鄉", "苗栗縣泰安鄉", "苗栗縣卓蘭鎮", "臺中市北屯區", "臺中市大里區", "臺中市霧峰區", "臺中市東勢區", "臺中市石岡區", "臺中市新社區", "臺中市和平區", "臺中市太平區", "彰化縣芬園鄉", "彰化縣社頭鄉", "彰化縣溪州鄉", "彰化縣田中鎮", "彰化縣二水鄉", "南投縣草屯鎮", "南投縣南投市", "南投縣中寮鄉", "南投縣名間鄉", "南投縣集集鎮", "南投縣仁愛鄉", "南投縣國姓鄉", "南投縣埔里鎮", "南投縣鹿谷鄉", "南投縣魚池鄉", "南投縣竹山鎮", "南投縣信義鄉", "南投縣水里鄉", "雲林縣古坑鄉", "雲林縣林內鄉", "雲林縣斗南鎮", "雲林縣大埤鄉", "雲林縣莿桐鄉", "雲林縣斗六市", "嘉義市東區", "嘉義縣水上鄉", "嘉義縣中埔鄉", "嘉義縣大林鎮", "嘉義縣民雄鄉", "嘉義縣梅山鄉", "嘉義縣番路鄉", "嘉義縣阿里山鄉", "嘉義縣竹崎鄉", "嘉義縣大埔鄉", "臺南市楠西區", "臺南市六甲區", "臺南市柳營區", "臺南市後壁區", "臺南市東山區", "臺南市白河區", "臺南市左鎮區", "宜蘭縣蘇澳鎮", "宜蘭縣冬山鄉", "宜蘭縣礁溪鄉", "宜蘭縣三星鄉", "宜蘭縣員山鄉", "宜蘭縣南澳鄉", "宜蘭縣大同鄉", "花蓮縣萬榮鄉", "花蓮縣秀林鄉", "花蓮縣卓溪鄉", "花蓮縣瑞穗鄉", "花蓮縣吉安鄉", "花蓮縣花蓮市", "花蓮縣光復鄉", "花蓮縣鳳林鎮", "花蓮縣壽豐鄉", "花蓮縣富里鄉", "花蓮縣玉里鎮"]);
const WARNING_COUNTIES = new Set(["南投縣", "嘉義市", "嘉義縣", "宜蘭縣", "彰化縣", "新北市", "新竹縣", "桃園市", "臺中市", "臺南市", "花蓮縣", "苗栗縣", "雲林縣"]);
const CIRCLE_AREAS = [];
const CIRCLE_ONLY = false;
const HEADLINE = "低溫特報";
const EFFECTIVE = "2026-03-12 10:46";
const EXPIRES = "2026-03-13 10:00";
const MAP_COLOR = "#00CED1";

const map = L.map('map').setView([23.7,121],7.5);

// 底圖選項
const baseLayers = {
  "🌙 深色": L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; CartoDB',maxZoom:18
  }),
  "☀️ 淺色": L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; CartoDB',maxZoom:18
  }),
  "🗺️ 標準": L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'&copy; OpenStreetMap',maxZoom:19
  }),
  "🛰️ 衛星": L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    attribution:'&copy; Esri',maxZoom:18
  })
};

// 預設使用淺色底圖（警戒區更清楚）
baseLayers["☀️ 淺色"].addTo(map);

// 鄉鎮邊界圖層
let townshipLayer = null;

fetch('townships.geojson').then(r=>r.json()).then(d=>{
  townshipLayer = L.geoJSON(d,{
    style:f=>{
      // Circle-only 模式：所有鄉鎮透明，只顯示邊界線
      if(CIRCLE_ONLY){
        return{
          fillColor:'transparent',
          fillOpacity:0,
          color:'#444',
          weight:0.5
        };
      }
      // 一般模式：警戒區填色，無警戒區透明
      const fullName=f.properties.COUNTYNAME+f.properties.TOWNNAME;
      const isWarning=WARNING_AREAS.has(fullName)||WARNING_COUNTIES.has(f.properties.COUNTYNAME);
      return{
        fillColor:isWarning?MAP_COLOR:'transparent',
        fillOpacity:isWarning?0.65:0,
        color:isWarning?'#fff':'#444',
        weight:isWarning?2:0.5
      };
    },
    onEachFeature:(f,layer)=>{
      const fullName=f.properties.COUNTYNAME+f.properties.TOWNNAME;
      const isWarning=WARNING_AREAS.has(fullName)||WARNING_COUNTIES.has(f.properties.COUNTYNAME);
      // Circle-only 模式下，popup 只顯示地名
      if(CIRCLE_ONLY){
        layer.bindPopup(`<div class="pt">${f.properties.COUNTYNAME} ${f.properties.TOWNNAME}</div>`,{maxWidth:260});
      }else{
        const status=isWarning?`<span style="color:#ff6b6b">⚠️ ${HEADLINE}</span>`:'✅ 無特報';
        layer.bindPopup(`<div class="pt">${f.properties.COUNTYNAME} ${f.properties.TOWNNAME}</div><div class="pi">${status}</div><div class="pi">⏰ ${EFFECTIVE} ～ ${EXPIRES}</div>`,{maxWidth:260});
      }
    }
  }).addTo(map);
  
  // 加入圖層控制（底圖 + 疊加層）
  const overlays = {"📍 鄉鎮邊界": townshipLayer};
  L.control.layers(baseLayers, overlays, {collapsed: false, position: 'topright'}).addTo(map);
});

// 繪製圓形警戒區
if(CIRCLE_AREAS.length>0){
  CIRCLE_AREAS.forEach(c=>{
    // 繪製圓形範圍
    const circle = L.circle([c.lat,c.lng],{
      radius:c.radius_km*1000,
      color:MAP_COLOR,
      weight:3,
      opacity:0.9,
      fillColor:MAP_COLOR,
      fillOpacity:0.25,
      dashArray:'8,4'
    }).addTo(map);
    
    // 標注中心點（災害地點）
    const centerIcon = L.divIcon({
      className:'center-marker',
      html:`<div style="background:${MAP_COLOR};width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.5)"></div>`,
      iconSize:[16,16],
      iconAnchor:[8,8]
    });
    const marker = L.marker([c.lat,c.lng],{icon:centerIcon}).addTo(map);
    
    // Popup 內容
    let popupContent = `<div class="pt">⚠️ ${HEADLINE}</div>`;
    popupContent += `<div class="pi" style="color:#ff6b6b;font-weight:600">📍 災害地點</div>`;
    if(c.description){
      popupContent += `<div class="pi">${c.description}</div>`;
    }
    popupContent += `<div class="pi">📏 警戒半徑：${c.radius_km} km</div>`;
    popupContent += `<div class="pi">🌐 ${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}</div>`;
    popupContent += `<div class="pi">⏰ ${EFFECTIVE} ～ ${EXPIRES}</div>`;
    
    marker.bindPopup(popupContent, {maxWidth:280});
    circle.bindPopup(popupContent, {maxWidth:280});
  });
  
  // 自動縮放到圓形範圍
  if(CIRCLE_AREAS.length===1){
    map.setView([CIRCLE_AREAS[0].lat,CIRCLE_AREAS[0].lng],11);
  }else{
    const bounds = CIRCLE_AREAS.map(c=>[c.lat,c.lng]);
    map.fitBounds(bounds,{padding:[50,50]});
  }
}
</script>
</body>
</html>
